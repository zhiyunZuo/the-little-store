<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小小的店 · The Little Store</title>
<script>
window.__errShown=false;
window.onerror=function(msg,src,line,col){
  if(window.__errShown) return; window.__errShown=true;
  try{
    var d=document.getElementById("errOverlay");
    if(!d){ d=document.createElement("div"); d.id="errOverlay"; document.body.appendChild(d); }
    d.style.display="flex";
    d.innerHTML='<div><b>页面出错了</b><br><span>'+(msg||"未知错误")+
      '</span><br><small>'+(src?String(src).split("/").pop():"")+' : '+line+' : '+col+'</small></div>';
  }catch(e){}
};
</script>
<style>
  :root{
    --paper:#f3e6cf; --ink:#432f23; --warm:#e8a85c; --line:#caa97f;
    --panel:#2a2118; --panel2:#332819; --soft:#e9dcc6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#0c0f16;color:var(--soft);
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;}
  #app{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
  .stage{position:relative;width:480px;height:270px;transform-origin:center;image-rendering:pixelated;}
  #store{position:absolute;inset:0;width:480px;height:270px;image-rendering:pixelated;
    border-radius:6px;box-shadow:0 6px 30px rgba(0,0,0,.5);background:#10131f;}
  #hud{position:absolute;top:10px;right:12px;text-align:right;font-size:12px;color:#e9dcc6;
    text-shadow:0 1px 2px #000;letter-spacing:.5px;pointer-events:none;opacity:.85;}
  #hud .w{font-size:13px;}
  #bar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
    display:flex;gap:8px;align-items:center;}
  .btn{font-family:inherit;font-size:12px;color:#3a2a1c;background:#e9d3ac;border:1px solid #b89868;
    padding:6px 12px;border-radius:14px;cursor:pointer;opacity:.92;transition:.25s;white-space:nowrap;}
  .btn:hover{opacity:1;background:#f1dcb4;}
  .btn:active{transform:translateY(1px);}
  .btn.ghost{background:rgba(233,220,198,.12);color:#e9dcc6;border-color:rgba(233,220,198,.25);}
  .btn[disabled]{opacity:.3;pointer-events:none;}
  .btn.hide{display:none;}
  #subtitle{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);
    max-width:86%;text-align:center;font-size:13px;color:#f3e6cf;
    text-shadow:0 1px 4px #000;opacity:0;transition:opacity 1.1s;pointer-events:none;line-height:1.5;}
  #subtitle.show{opacity:1;}
  #toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);
    background:rgba(20,16,12,.7);color:#f3e6cf;font-size:14px;padding:8px 16px;border-radius:14px;
    opacity:0;transition:.4s;pointer-events:none;}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .overlay{position:absolute;inset:0;background:rgba(10,12,18,.86);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;flex-direction:column;padding:18px;z-index:20;}
  .overlay.hidden{display:none;}
  .hidden{display:none !important;}
  .card{background:var(--panel);border:1px solid #4a3a28;border-radius:10px;padding:16px 18px;
    width:420px;max-width:92%;max-height:88%;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.5);position:relative;}
  .card h2{margin:0 0 10px;font-size:15px;color:#f0dcbb;font-weight:600;letter-spacing:1px;}
  .card p{font-size:12.5px;line-height:1.7;color:#d8c8ac;margin:6px 0;}
  .small{font-size:11.5px;color:#b6a487;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .closeX{position:absolute;top:10px;right:14px;font-size:20px;color:#b6a487;cursor:pointer;}
  .closeX:hover{color:#f0dcbb;}
  /* ---------- Opening（电影式开场，原始版本） ---------- */
  #opening{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    background:#0a0806;text-align:center;padding:14px;z-index:30;cursor:pointer;overflow:auto;transition:opacity .9s ease;}
  #opening.gone{opacity:0;pointer-events:none;}
  #introStage{position:relative;width:min(84vw,300px,46vh);margin:auto;z-index:0;}
  #introCanvas{width:100%;height:auto;border-radius:3px;display:block;}
  #introTitle{position:absolute;top:14%;left:0;right:0;text-align:center;font-size:14px;
    letter-spacing:.22em;color:rgba(243,230,207,0.82);opacity:0;
    pointer-events:none;font-weight:400;z-index:5;}
  #introTitle.show{animation:introTitleFlow 8.5s ease-in-out forwards;}
  @keyframes introTitleFlow{
    0%{opacity:0;}
    32%{opacity:1;}
    64%{opacity:1;}
    100%{opacity:0;}
  }
  #introBox{position:relative;width:100%;min-height:32px;z-index:5;margin-top:5px;
    padding:8px 12px;background:rgba(16,12,8,.82);border:1px solid rgba(180,152,104,.25);border-radius:3px;
    color:#f3e6cf;font-size:clamp(12px,3.2vw,14px);line-height:1.55;letter-spacing:.03em;text-align:center;
    box-shadow:0 4px 18px rgba(0,0,0,.35);}
  #introBox.scene{color:#c9b48f;font-style:italic;}
  #introBox.sound{color:#9fb8d8;font-style:italic;}
  #introBox .ic{display:inline-block;width:9px;color:#e8a85c;animation:blink 1s steps(1) infinite;margin-left:3px;}
  #introHint{position:absolute;right:8px;bottom:2px;color:rgba(184,152,104,.45);font-size:12px;animation:blink 1.4s steps(1) infinite;pointer-events:none;z-index:6;}
  #introFade{position:absolute;inset:0;background:#0a0806;opacity:0;pointer-events:none;z-index:1;}
  #openDoorBtn{position:relative;display:none;width:fit-content;max-width:150px;margin:10px auto 0;padding:6px 24px;font-size:13px;letter-spacing:.18em;cursor:pointer;
    color:#3a2e1e;background:#b89868;border:1px solid #6b5236;border-radius:2px;
    box-shadow:none;font-family:inherit;z-index:6;transition:background .15s,border-color .15s;flex:none;}
  #openDoorBtn:hover{background:#c4a87a;border-color:#7a5c38;}
  @keyframes blink{50%{opacity:0;}}
  #making{position:absolute;inset:0;background:rgba(8,10,16,.9);display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:25;}
  #making.hidden{display:none;}
  #makeCanvas{width:300px;height:200px;image-rendering:pixelated;}
  #makeHint{margin-top:10px;font-size:13px;color:#e9dcc6;letter-spacing:2px;}
  .book{border:1px solid #4a3a28;border-radius:8px;padding:10px;margin:8px 0;background:#241b13;cursor:pointer;transition:.2s;}
  .book:hover{border-color:#b89868;}
  .book .t{font-size:13.5px;color:#f0dcbb;}
  .book .a{font-size:11.5px;color:#a98f6d;margin-top:2px;}
  .book .i{font-size:12px;color:#cdbb9c;margin-top:6px;line-height:1.6;}
  .book .r{font-size:12px;color:#e8c08a;margin-top:6px;}
  .collected{color:#8fcf9a !important;}
  .mc-div{border:none;border-top:1px dashed #4a3a28;margin:14px 2px 6px;}
  .mc-sub{font-size:12.5px;color:#e8c08a;margin:6px 2px 2px;font-weight:600;}
  .book.learn{border-style:dashed;border-color:#5f8f6a;background:#1d241a;}
  .book.learn .a{color:#8fcf9a;}
  .qbox{margin:10px 0 4px;padding:12px 14px;background:#221a12;border:1px solid #4a3a28;border-radius:10px;}
  .qcap{font-size:11px;color:#a98f6d;text-align:center;letter-spacing:2px;margin-bottom:8px;}
  .qbox blockquote{margin:0;padding:0 4px;font-size:13px;line-height:1.75;color:#f0dcbb;min-height:3.2em;
    border-left:3px solid #b89868;padding-left:12px;}
  .qnav{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
  .qidx{font-size:11px;color:#a98f6d;}
  .btn.tiny{font-size:11px;padding:4px 10px;}
  textarea{width:100%;min-height:70px;background:#1c150f;border:1px solid #4a3a28;border-radius:8px;
    color:#ece0c8;font-family:inherit;font-size:13px;padding:8px;resize:vertical;line-height:1.6;}
  .note{background:#efe2c8;color:#4a3826;border-radius:8px;padding:8px 10px;margin:7px 0;
    font-size:12.5px;line-height:1.6;position:relative;box-shadow:2px 2px 0 rgba(0,0,0,.2);}
  .note .who{display:block;font-size:10.5px;color:#8a6f4f;margin-top:4px;}
  .note .del{position:absolute;top:4px;right:6px;color:#a06a4a;cursor:pointer;font-size:13px;}
  .note .del:hover{color:#c4502f;}
  #diaryCard{background:#f3e6cf;color:#432f23;border:1px solid #d8c39a;
    background-image:linear-gradient(#f3e6cf,#efe0c4);}
  #diaryCard h2{color:#5a3f2a;}
  #diaryCard .pg{position:relative;min-height:210px;padding:14px 16px;}
  #weatherIcon{position:absolute;top:10px;right:12px;}
  .diaryText{font-family:"Kaiti SC","STKaiti","KaiTi",cursive;font-size:15px;line-height:1.9;
    white-space:pre-wrap;margin-top:8px;color:#4a3424;}
  .tape{position:absolute;width:46px;height:14px;background:rgba(210,180,130,.5);top:-6px;left:30px;
    transform:rotate(-4deg);}
  .flower{position:absolute;bottom:8px;left:12px;font-size:16px;opacity:.7;}
  .diaryDate{font-size:12px;color:#8a6f4f;letter-spacing:1px;}
  .navBtn{background:#e6d2ad;border:1px solid #c9b083;color:#5a3f2a;border-radius:10px;
    padding:4px 10px;font-size:12px;cursor:pointer;}
  .navBtn:hover{background:#f0dcb4;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#4a3a28;border-radius:4px;}

  /* ---- 开场旁白（对话框样式见上方 #introBox） ---- */

  /* ---- 顶部声音开关（时间旁边） ---- */
  #hud #btnMute{display:block;margin-top:7px;pointer-events:auto;
    font-family:inherit;font-size:12px;color:#e9dcc6;background:rgba(233,220,198,.12);
    border:1px solid rgba(233,220,198,.25);border-radius:10px;padding:3px 9px;cursor:pointer;transition:.2s;}
  #hud #btnMute:hover{background:rgba(233,220,198,.22);}
  #hud #btnMute.muted{opacity:.45;text-decoration:line-through;}

  /* ---- 柜台情境按钮（不再堆在底部） ---- */
  #counterUI{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;z-index:15;}
  #counterUI .btn{font-size:11px;padding:5px 10px;}

  /* ---- 店内 Shelter 入口（点击即可进入） ---- */
  #shelterSpot{position:absolute;left:20px;top:150px;z-index:14;cursor:pointer;
    font-size:10.5px;color:rgba(243,230,207,.7);letter-spacing:1px;
    padding:3px 7px;border-radius:8px;transition:.3s;pointer-events:auto;
    text-shadow:0 1px 3px #000;user-select:none;}
  #shelterSpot:hover{color:#f3e6cf;background:rgba(40,32,22,.35);}
  #shelterSpot .sofa{font-size:13px;margin-right:3px;vertical-align:-1px;}

  /* ---- Shelter 角落：坐下后进入的空间 ---- */
  #shelterCard{width:432px;padding:14px 16px;}
  #sceneWrap{position:relative;width:100%;line-height:0;border-radius:8px;overflow:hidden;}
  #shelterCanvas{width:100%;height:auto;display:block;image-rendering:pixelated;
    border:1px solid #4a3a28;border-radius:8px;}
  .spot{position:absolute;transform:translate(-50%,-50%);font-family:inherit;font-size:11px;
    letter-spacing:.6px;color:#f3e6cf;background:rgba(26,20,15,.82);
    border:1px solid rgba(180,152,104,.5);border-radius:12px;padding:4px 10px;cursor:pointer;
    white-space:nowrap;transition:.25s;box-shadow:0 2px 10px rgba(0,0,0,.45);}
  .spot:hover{background:rgba(62,49,33,.96);border-color:#b89868;color:#fff8ec;}
  .scenePanel{max-height:148px;overflow:auto;margin-top:2px;}
  .scenePanel h3{font-size:13px;color:#f0dcbb;margin:2px 0 8px;font-weight:600;letter-spacing:1px;}
  #shelterScene .row{margin-top:9px;justify-content:flex-end;}
  #errOverlay{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;
    background:#1a1410;color:#f3e6cf;padding:24px;text-align:center;font-size:14px;line-height:1.8;}
  #errOverlay b{color:#e8a85c;font-size:16px;}
  #errOverlay small{color:#9a8a72;font-size:12px;}
</style>
</head>
<body>
<div id="app">
  <div class="stage" id="stage">
    <canvas id="store" width="480" height="270"></canvas>
    <div id="hud">
      <div class="w" id="hudTime">08:00</div>
      <div id="hudWeather">晴</div>
      <button id="btnMute" title="声音开关">♪</button>
    </div>
    <div id="subtitle"></div>
    <div id="toast"></div>
    <div id="counterUI">
      <button class="btn ghost hide" id="btnMake">制作饮品</button>
      <button class="btn ghost hide" id="btnDiary">手账</button>
      <button class="btn hide" id="btnCheck">结账</button>
    </div>
    <div id="shelterSpot"><span class="sofa">🛋</span>Shelter 角落</div>
    <div id="opening">
      <div id="introStage">
        <canvas id="introCanvas" width="360" height="200"></canvas>
        <div id="introTitle"></div>
        <div id="introBox"><span id="introText"></span><div id="introHint">点击继续 ▾</div></div>
        <button id="openDoorBtn">开门</button>
      </div>
      <div id="introFade"></div>
    </div>
    <div id="making" class="hidden">
      <canvas id="makeCanvas" width="300" height="200"></canvas>
      <div id="makeHint">做一杯…</div>
    </div>
    <div id="makeMenu" class="overlay hidden">
      <div class="card" id="makeMenuCard"></div>
    </div>
    <div id="shelter" class="overlay hidden">
      <div class="card" id="shelterCard">
        <span class="closeX" data-close="shelter">×</span>
        <!-- 阶段一：还没坐下，只能先坐下 -->
        <div id="shelterEnter">
          <h2>Shelter · 一个可以暂时不赶路的地方</h2>
          <p class="small">靠窗的小角落。沙发、木桌、暖灯，还有一面可以贴便利贴的墙，和一个慢慢变丰富的书架。</p>
          <div class="row">
            <button class="btn" id="sSit">坐下歇会儿</button>
            <button class="btn ghost" id="sLeave">离开</button>
          </div>
        </div>
        <!-- 阶段二：坐下之后，真正进入这个角落 -->
        <div id="shelterScene" class="hidden">
          <div id="sceneWrap">
            <canvas id="shelterCanvas" width="400" height="160"></canvas>
            <!-- 按键分别落在：书架上 / 便签墙上 / 桌子上 -->
            <button class="spot" id="spotShelf" style="left:15%;top:53%">看书架</button>
            <button class="spot" id="spotWall" style="left:44%;top:40%">便签墙</button>
            <button class="spot" id="spotNote" style="left:45.5%;top:75%">写便签</button>
          </div>
          <div class="row">
            <button class="btn ghost" id="sStand">起身离开</button>
          </div>
        </div>
      </div>
    </div>
    <div id="shelfPanel" class="overlay hidden" style="z-index:22">
      <div class="card">
        <span class="closeX" data-close="shelfPanel">×</span>
        <h2>书架</h2>
        <p class="small">慢慢翻。遇见一本就带走一本，或者只是记住它。</p>
        <div id="shelfList"></div>
      </div>
    </div>
    <div id="bookModal" class="overlay hidden" style="z-index:24">
      <div class="card">
        <span class="closeX" data-close="bookModal">×</span>
        <h2 id="bkTitle"></h2>
        <p class="small" id="bkAuthor"></p>
        <p id="bkIntro"></p>
        <p class="r" id="bkRec" style="color:#e8c08a"></p>
        <div class="qbox" id="bkQuoteBox" style="display:none">
          <div class="qcap">· 常被读到的几句 ·</div>
          <blockquote id="bkQuoteText"></blockquote>
          <div class="qnav">
            <button class="btn ghost tiny" id="bkQPrev">‹ 上一句</button>
            <span class="qidx" id="bkQIdx"></span>
            <button class="btn ghost tiny" id="bkQNext">下一句 ›</button>
          </div>
        </div>
        <div class="row">
          <button class="btn" id="bkCollect">收藏这本书</button>
          <button class="btn ghost" id="bkBack">返回</button>
        </div>
      </div>
    </div>
    <div id="notes" class="overlay hidden">
      <div class="card">
        <span class="closeX" data-close="notes">×</span>
        <h2>共享读书墙</h2>
        <p class="small">墙上慢慢出现一些便签，一部分来自这里的人，一部分来自你。刷新也不会消失。</p>
        <div id="notesList"></div>
        <div class="row">
          <textarea id="noteInput" placeholder="写点什么吧——一句话、一句摘抄、一个很小的念头，都可以。"></textarea>
        </div>
        <div class="row">
          <button class="btn" id="noteAdd">留下便签</button>
        </div>
      </div>
    </div>
    <div id="diary" class="overlay hidden">
      <div class="card" id="diaryCard">
        <span class="closeX" data-close="diary">×</span>
        <div class="pg">
          <div class="tape"></div>
          <canvas id="weatherIcon" width="40" height="40"></canvas>
          <div class="diaryDate" id="diaryDate"></div>
          <div class="diaryText" id="diaryText"></div>
          <div class="flower">❀</div>
          <div class="row" style="margin-top:14px">
            <button class="navBtn" id="dPrev">← 前一天</button>
            <button class="navBtn" id="dNext">后一天 →</button>
            <button class="btn" id="dWrite" style="margin-left:auto">写一句</button>
            <button class="btn ghost" id="dClose">合上</button>
          </div>
          <div id="dEditor" style="display:none;margin-top:10px">
            <textarea id="dInput" placeholder="今天店长想写点什么……"></textarea>
            <div class="row"><button class="btn" id="dSave">保存这一页</button></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
"use strict";
/* =========================================================================
   《小小的店》— 一个可以每天回来生活一会儿的小镇便利店
   设计方向：安静、轻松、有一点点故事的生活体验。
   已彻底移除：自由输入聊天 / 自动回复 / 连续剧情对话 / 好感度 / 任务 /
   等级 / 金币 / 复杂经营数值。玩家无需输入任何台词。
   ========================================================================= */
const $ = id => document.getElementById(id);
const stage = $("stage"), cv = $("store"), ctx = cv.getContext("2d");
const W = 480, H = 270;
const lerp = (a,b,t)=>a+(b-a)*t;
const rnd = (a,b)=>a+Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const ALL_DRINKS = ["热牛奶","咖啡","柠檬茶","蜂蜜牛奶","冰柠檬水","热可可"];

/* ---------- 持久化状态 ---------- */
const SAVE_KEY = "tls_state_v2";
const DEFAULT_STATE = {
  day:1, dateStr:"", minutes:480, storeOpen:false,
  weather:"晴", shelterLamp:false, mute:false,
  unlocked:["热牛奶","咖啡","柠檬茶"],
  notes:{player:[], npc:[]}, books:[], diary:{}, seenEvents:[], lastLeave:""
};
let S = load();
function load(){
  // 基准默认态（深拷贝，避免污染 DEFAULT_STATE）
  const s = JSON.parse(JSON.stringify(DEFAULT_STATE));
  try{
    const r = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(r && typeof r === "object") Object.assign(s, r);
  }catch(e){}
  // 规范化嵌套结构：旧版 / 损坏存档若字段类型不对，强制纠正，避免运行时崩溃（主要是便签墙与书架）
  s.notes = (s.notes && typeof s.notes === "object" && !Array.isArray(s.notes))
    ? { player: Array.isArray(s.notes.player)?s.notes.player:[], npc: Array.isArray(s.notes.npc)?s.notes.npc:[] }
    : { player: [], npc: [] };
  s.books = Array.isArray(s.books) ? s.books.filter(x=>typeof x === "string") : [];
  s.unlocked = Array.isArray(s.unlocked) ? s.unlocked.filter(x=>typeof x === "string") : ["热牛奶","咖啡","柠檬茶"];
  s.seenEvents = Array.isArray(s.seenEvents) ? s.seenEvents : [];
  s.npcLast = (s.npcLast && typeof s.npcLast === "object") ? s.npcLast : {};
  s.diary = (s.diary && typeof s.diary === "object" && !Array.isArray(s.diary)) ? s.diary : {};
  if(typeof s.minutes !== "number" || isNaN(s.minutes)) s.minutes = 480;
  if(typeof s.day !== "number" || isNaN(s.day)) s.day = 1;
  if(typeof s.weather !== "string") s.weather = "晴";
  if(typeof s.storeOpen !== "boolean") s.storeOpen = false;
  if(typeof s.shelterLamp !== "boolean") s.shelterLamp = false;
  if(typeof s.mute !== "boolean") s.mute = false;

/* ---------- 顾客 ---------- */
let customers = [];
let cidSeq = 1;
function presentIds(){ return customers.map(c=>c.ch.id); }
function spawnCustomer(ch){
  let isVisitor = Math.random()<ch.vChance;
  let need=null, kind=null;
  if(!isVisitor){
    if(ch.drink.length && Math.random()<0.62 && ch.drink.some(d=>S.unlocked.includes(d))){
      need = pick(ch.drink.filter(d=>S.unlocked.includes(d))); kind="drink";
    } else if(ch.good.length){
      need = pick(ch.good); kind="good";
    } else { isVisitor=true; }
  }
  const c = {
    cid:cidSeq++, ch, need, kind, isVisitor,
    x:452, y:206, tx:452, ty:206, state:"enter",
    sit: ch.sit && Math.random()<0.5 ? ch.sit : null,
    sitTimer:0, made:false, spawnT:performance.now(), bookDrop:false, left:false
  };
  customers.push(c);
  maybeNarrationSpawn(ch, c);
  return c;
}
function trySpawn(){
  if(!S.storeOpen) return;
  if(customers.length>=3) return;
  if(Math.random()>0.55) return;
  const h=hour();
  const avail = CHARS.filter(ch=>!presentIds().includes(ch.id) && h>=ch.sched[0] && h<=ch.sched[1]);
  if(!avail.length) return;
  let pool = avail;
  const wxMatch = avail.filter(ch=> (ch.wx==="rain"&&S.weather.includes("雨")) || (ch.wx==="sun"&&S.weather==="晴") );
  if(wxMatch.length && Math.random()<0.6) pool = wxMatch;
  spawnCustomer(pick(pool));
}

/* ---------- 顾客状态机 ---------- */
function checkoutQueue(){
  const q = customers.filter(c=>c.state==="atCounter"||c.state==="waiting"||c.state==="take")
    .sort((a,b)=>a.spawnT-b.spawnT);
  q.forEach((c,i)=>{ c.tx = 214 + i*26; c.ty = 200; });
}
function reached(c){ return Math.abs(c.x-c.tx)<3 && Math.abs(c.y-c.ty)<3; }
function moveToCounter(c){ c.state="atCounter"; c.tx=214; c.ty=200; }
function updateCustomers(dt){
  for(let i=customers.length-1;i>=0;i--){
    const c=customers[i];
    c.x=lerp(c.x,c.tx,Math.min(1,dt*2.4));
    c.y=lerp(c.y,c.ty,Math.min(1,dt*2.4));
    switch(c.state){
      case "enter":
        if(c.isVisitor){ c.tx=96; c.ty=176; if(reached(c)){ c.state="sit"; c.sitTimer=performance.now()+rnd(6000,12000);} }
        else if(c.kind==="good"){ c.tx=372; c.ty=164; if(reached(c)){ c.state="takeGood"; c.sitTimer=performance.now()+1200; } }
        else { c.tx=214; c.ty=200; if(reached(c)){ c.state="waiting"; } }
        break;
      case "takeGood":
        if(performance.now()>c.sitTimer){ moveToCounter(c); }
        break;
      case "waiting":
        if(c.made){ c.state="take"; c.sitTimer=performance.now()+900; }
        break;
      case "take":
        if(performance.now()>c.sitTimer){ moveToCounter(c); }
        break;
      case "atCounter": break;
      case "sit":
        if(performance.now()>c.sitTimer){
          if(c.isVisitor){ c.state="leaving"; c.tx=452; c.ty=206; }
          else moveToCounter(c);
        }
        break;
      case "leaving":
        if(c.x>460){ customers.splice(i,1); maybeNarrationLeave(c); }
        break;
    }
  }
  checkoutQueue();
}
function doCheckout(){
  const q = customers.filter(c=>c.state==="atCounter").sort((a,b)=>a.spawnT-b.spawnT);
  if(!q.length) return;
  const c=q[0];
  sfx("checkout");
  c.state="leaving"; c.tx=452; c.ty=206;
  toast("好了，慢走——");
  if(Math.random()<0.18) narrate(pick([ c.ch.name+"今天走得快，把伞忘在了门口。", "门铃响了一声，"+c.ch.name+"已经到了街上。" ]));
  if(c.ch.bookChance && Math.random()<c.ch.bookChance && !c.bookDrop){
    c.bookDrop=true; setTimeout(()=>dropNpcBook(c.ch), 1500);
  }
}

/* ---------- 饮品制作动画（Canvas，3~6秒） ---------- */
function drawMake(){
  if(!making) return;
  const mc=$("makeCanvas"), x=mc.getContext("2d"); const w=300,h=200;
  const p=clamp((performance.now()-making.start)/making.dur,0,1);
  x.clearRect(0,0,w,h);
  x.fillStyle="#1c150f"; x.fillRect(0,0,w,h);
  x.fillStyle="#2a2118"; x.fillRect(40,h-46,w-80,46);
  x.fillStyle="rgba(232,168,92,.08)"; x.fillRect(40,h-46,w-80,6);
  const cx=w/2, cy=h-72;
  drawCup(x,cx,cy,making.drink,p);
  if(p>=1){ x.fillStyle="rgba(243,230,207,.9)"; x.font="14px sans-serif"; x.textAlign="center"; x.fillText("好了",cx,40); finishMake(); }
}
function drawCup(x,cx,cy,drink,p){
  const cupW=34, cupH=46, topY=cy-cupH;
  x.fillStyle="#e9e2d4"; x.fillRect(cx-cupW/2,topY,cupW,cupH);
  x.fillStyle="#fff"; x.fillRect(cx-cupW/2+2,topY+2,cupW-4,cupH-4);
  x.strokeStyle="#d8cfbe"; x.lineWidth=3; x.beginPath(); x.arc(cx+cupW/2+4,cy-cupH/2,8,-1.2,1.2); x.stroke();
  if(drink==="热牛奶"||drink==="蜂蜜牛奶"){
    const fp=clamp(p/0.5,0,1);
    x.fillStyle="#f3ecdf"; x.fillRect(cx-cupW/2+3, topY+4+(cupH-8)*(1-fp), cupW-6, (cupH-8)*fp);
    if(drink==="蜂蜜牛奶" && p>0.45){ x.fillStyle="#c98a2e"; x.beginPath(); x.arc(cx, topY+8+(cupH-8)*(1-fp)+3, 3,0,7); x.fill();
      if(p>0.55){ x.save(); x.translate(cx,topY+10); x.rotate(Math.sin(p*8)*0.3); x.fillStyle="rgba(201,138,46,.6)"; x.fillRect(-cupW/2+4,0,cupW-8,2); x.restore(); } }
    steam(x,cx,topY,p>0.6);
  } else if(drink==="热可可"){
    const fp=clamp(p/0.45,0,1);
    x.fillStyle="#6b4326"; x.fillRect(cx-cupW/2+3, topY+4+(cupH-8)*(1-fp), cupW-6, (cupH-8)*fp);
    if(p>0.4 && p<0.6){ for(let i=0;i<6;i++){ x.fillStyle="#3a2414"; x.fillRect(cx-cupW/2+5+i*4, topY+6,2,2);} }
    steam(x,cx,topY,p>0.6);
  } else if(drink==="咖啡"){
    if(p<0.5){ x.strokeStyle="#5a3a22"; x.lineWidth=2; x.beginPath(); x.moveTo(cx+18,topY-14); x.quadraticCurveTo(cx+10,topY-2,cx,topY+4); x.stroke(); }
    const fp=clamp(p/0.5,0,1);
    x.fillStyle="#6b4326"; x.fillRect(cx-cupW/2+3, topY+4+(cupH-8)*(1-fp), cupW-6, (cupH-8)*fp);
    if(p>0.5){ x.save(); x.translate(cx,topY+8); x.rotate(p*4); x.strokeStyle="rgba(255,255,255,.25)"; x.lineWidth=1.5; x.beginPath(); x.arc(0,0,7,-1,2); x.stroke(); x.restore(); }
    steam(x,cx,topY,p>0.6);
  } else if(drink==="柠檬茶"||drink==="冰柠檬水"){
    const fp=clamp(p/0.5,0,1);
    x.fillStyle = drink==="冰柠檬水" ? "rgba(220,235,240,.85)" : "#e8d98a";
    x.fillRect(cx-cupW/2+3, topY+4+(cupH-8)*(1-fp), cupW-6, (cupH-8)*fp);
    if(drink==="冰柠檬水" && p<0.25){ for(let i=0;i<3;i++){ x.fillStyle="rgba(220,240,245,.9)"; x.fillRect(cx-8+i*8, topY+10+i*5, 7,7);} }
    if(p>0.55){ x.fillStyle="#cfe06a"; x.beginPath(); x.ellipse(cx, topY+12, 7,3,0,0,7); x.fill(); }
    if(drink==="冰柠檬水"){ x.fillStyle="rgba(255,255,255,.18)"; x.fillRect(cx-cupW/2+1,topY+2,3,cupH-4); }
  }
}
function steam(x,cx,topY,p){
  if(!p) return;
  x.strokeStyle="rgba(255,255,255,.35)"; x.lineWidth=2;
  for(let i=-1;i<=1;i++){
    const sx=cx+i*8;
    x.beginPath();
    for(let t=0;t<14;t++){ const yy=topY-4-t*2.2; const xx=sx+Math.sin((t*0.5)+(performance.now()/300)+i)*2.4; if(t===0)x.moveTo(xx,yy); else x.lineTo(xx,yy); }
    x.globalAlpha=0.35; x.stroke(); x.globalAlpha=1;
  }
}

   q:['让我们想象一个洞穴式的地下室，它有一条长长的通道通向外面，可让和洞穴一样宽的一路亮光照进来。有一些人从小就住在这洞穴里，头颈和腿脚都绑着，不能走动也不能转头，只能向前看着洞穴后壁。',
      '在他们背后远处高些的地方有东西燃烧着发出火光。在火光和这些被囚禁者之间，在洞外上面有一条路。沿着路边已筑有一带矮墙。矮墙的作用像傀儡戏演员在自己和观众之间设的一道屏障，他们把木偶举到屏障上头去表演。',
      '有一些人拿着各种器物举过墙头，从墙后面走过，有的还举着用木料、石料或其他材料制作的假人和假兽。而这些过路人，你可以料到有的在说话，有的不在说话。',
      '这些囚徒除了火光投射到他们对面洞壁上的阴影而外，他们还能看到自己的或同伴们的什么呢？',
      '如果囚徒们能够彼此交谈，你不认为，他们会断定这些影子是真实的事物吗？']},
  {id:"petit",t:"小王子",a:"[法] 安托万·德·圣埃克苏佩里",i:"一个从很小星球来的孩子，遇见了大人世界里许多奇怪的事。",r:"适合想起来某个很小的大人。",
   q:['所有大人都曾经是小孩，但是很少有人记得。',
      '大人们热爱数字。当你跟他们说你认识了新朋友，他们从来不会问你重要的事情。',
      '一个人非常悲伤的时候，就会喜欢看日落。有一天，我看了四十四次日落。',
      '你在你的玫瑰上花费的时间，使你的玫瑰变得重要。',
      '只有用心才能看得清，本质的东西眼睛是看不见的。',
      '沙漠之所以美丽，是因为它在某个角落里藏着一口井。',
      '对我来说，你不过是一个小男孩，和千百个小男孩一样。但如果你驯服我，我们就互相不可缺少。对我来说，你就是世界上独一无二的；我对你来说，也是世界上独一无二的。',
      '你下午四点钟来，那么从三点起，我就开始感到幸福。',
      '仪式感就是使某一天与其他日子不同，使某一时刻与其他时刻不同。',
      '星星发亮是为了让每一个人有一天都能找到属于自己的星星。']},
  {id:"conv",t:"不便的便利店",a:"[韩] 金浩然",i:"一家深夜便利店，和一位总在夜里来、渐渐被点亮起来的大叔。",r:"适合深夜回到店里的时候。",
   q:['人哪，就该尝一尝不方便的滋味。',
      '“有说戴口罩不方便的，也有说因为疫情这个那个不方便的，还有说自己想怎样就怎样的，可是这个社会本来就是这样啊，生活本来就是不方便的。”“好像是……这样的。”',
      '“就是说啊在便利店里和客人接触一来二去好像就跟大家熟络了起来。就算刚开始只是假装亲近，可慢慢地，好像也就真的亲近起来了。”',
      '她说，人生本来就是一个不断解决问题的过程。反正无论如何都是要解决问题的，何不努力去挑选一个好点儿的问题来解决呢。',
      '廉女士一边担心男子会把鼻涕蹭到自己的收纳包上，一边又对这样的自己反感不已。',
      '如果老板都不懂得尊重员工，那么员工也不会尊重顾客。',
      '这个社会也不是说只要你一直在正轨上奔跑，就一定能平安抵达目的地。',
      '仔细想想，其实家人不也是我们在人生旅途上遇见的客人吗？不管是贵宾还是不速之客，只要像对待客人一样对待他们，就不会互相造成伤害。',
      '“这是……玉米须茶，心情不好的时候……最适合喝它了。”',
      '归根结底，生活就是一种关系，而关系就在于沟通。现在我才明白，原来幸福并不遥远，它就在和身边人分享心声的过程当中。']},
  {id:"birds",t:"飞鸟集",a:"[印] 拉宾德拉纳特·泰戈尔",i:"一百余首小诗，像飞鸟一样短，却留在心上很久。",r:"适合想抬头看一会儿天的时候。",
   q:['夏天的飞鸟，飞到我的窗前唱歌，又飞去了。秋天的黄叶，它们没有什么可唱，只叹息一声，飞落在那里。',
      '世界对着它的爱人，把它浩翰的面具揭下了。它变小了，小如一首歌，小如一回永恒的接吻。',
      '如果你因失去了太阳而流泪，那么你也将失去群星了。',
      '忧思在我的心里平静下去，正如暮色降临在寂静的山林中。',
      '你看不见你自己，你所看见的只是你的影子。',
      '你微微地笑着，不同我说什么话。而我觉得，为了这个，我已等待得久了。',
      '使生如夏花之绚烂，死如秋叶之静美。',
      '我们的生命是度过大海，我们到了死时，便到了岸，各往各的世界去了。']},
  {id:"meditations",t:"沉思录",a:"[古罗马] 马可·奥勒留",i:"一位罗马皇帝写给自己的私人笔记，关于怎样好好活着。",r:"适合心里有点乱、需要安静下来的时候。",
   q:['以一种欢乐的心情等待死亡，把死亡看做不是别的，只是组成一切生物的元素的分解。死是合乎本性的，而合乎本性的东西都不是恶。',
      '如果你因为什么外在的事物而感到痛苦，打扰你的不是这一事物，而是你自己对它的判断。而现在清除这一判断是在你的力量范围之内。',
      '当你不把你的思想指向公共福利的某个目标时，不要把你剩下的生命浪费在思考别人上。因为，当你有这种思想时，你就丧失了做别的事情的机会。',
      '在人的生活中，时间是瞬息即逝的一个点，实体处在流动之中，知觉是迟钝的，整个身体的结构容易分解，灵魂是一涡流，命运之谜不可解，名声并非根据明智的判断。一言以蔽之，属于身体的一切只是一道激流，属于灵魂的只是一个梦幻，生命是一场战争，一个过客的旅居，身后的名声也迅速落入忘川。',
      '不要不情愿地劳作，不要不尊重公共利益，不要不加以适当的考虑，不要分心，不要虚有学问的外表而丧失自己的思想。同时，也欢乐吧，不寻求外在的帮助也不要别人给的安宁。',
      '丢开你的意见，那么你就丢开了这种抱怨：“我受到了伤害。”而丢开“我受到了伤害”的抱怨，这伤害也就消失了。',
      '永远记住：你的心灵是不可征服的。',
      '唯一能从一个人那里夺走的只是现在。如果这是真的，即一个人只拥有现在，那么一个人就不可能丧失一件他并不拥有的东西。']},
  {id:"zhuangzi",t:"庄子",a:"庄周",i:"战国时的人，讲鱼、鹏、江湖、蝴蝶，也讲人怎么活得更自在。",r:"适合想不通、想放下的晚上。",
   q:['北冥有鱼，其名为鲲，鲲之大，不知其几千里也。化而为鸟，其名为鹏，鹏之背，不知其几千里也。',
      '吾生也有涯，而知也无涯。以有涯随无涯，殆已。',
      '泉涸，鱼相与处于陆，相呴以湿，相濡以沫，不如相忘于江湖。',
      '天地与我并生，而万物与我为一。',
      '至人无己，神人无功，圣人无名。',
      '夫大块载我以形，劳我以生，佚我以老，息我以死。故善吾生者，乃所以善吾死也。',
      '吾以天地为棺椁，以日月为连璧，星辰为珠玑，万物为赍送。吾葬具岂不备邪？何以加此！',
      '忘足，履之适也；忘要，带之适也；知忘是非，心之适也。']},
  {id:"tsurezure",t:"徒然草",a:"[日] 吉田兼好",i:"日本古代的随笔，像一个人在灯下断断续续写下对世事的看法。",r:"适合睡前随手翻一两段。",
   q:['人心是不待风吹而自落的花。',
      '人如果立身简素，不慕豪奢，不敛财货，不贪图功名利禄，则可谓人中之上品也。',
      '飞鸟川的渊渚变化不定，人世的无常，也同样如此。',
      '世事无常，万物都不足以长久倚赖。执迷不悟的人深信此生有物可恃，必争为己有，于是心生怨怒之情。',
      '天地万物，寿命之长没有能超过人的。其他如蜉蝣，早上出生晚上即死；如夏蝉，只消活得一夏而不知有春秋。抱着从容恬淡的心态过日子，那么一年都显得如此悠游、漫长无尽。',
      '独坐灯下，披卷诵读，与古为友，是最上的慰安。',
      '世上的事，最令人回味的，是始和终这两端。']}
];

function openBookModal(b){
  $("bkTitle").textContent=b.t; $("bkAuthor").textContent="文 / "+b.a;
  $("bkIntro").textContent=b.i; $("bkRec").textContent="· "+b.r;
  const collected=S.books.includes(b.id);
  $("bkCollect").textContent=collected?"已在书架 · 取消收藏":"收藏这本书";
  $("bkCollect").className=collected?"btn ghost":"btn";
  $("bkCollect").onclick=()=>{ if(S.books.includes(b.id)) S.books=S.books.filter(x=>x!==b.id); else S.books.push(b.id); save(); openBookModal(b); };
  $("bkBack").onclick=()=>$("bookModal").classList.add("hidden");
  // 常被读到的几句 · 翻阅
  const q=b.q||[]; const qbox=$("bkQuoteBox");
  if(q.length){
    qbox.style.display="";
    let qi=0;
    const renderQ=()=>{ $("bkQuoteText").textContent=q[qi]; $("bkQIdx").textContent=(qi+1)+" / "+q.length; };
    renderQ();
    $("bkQPrev").onclick=()=>{ qi=(qi-1+q.length)%q.length; renderQ(); sfx("page"); };
    $("bkQNext").onclick=()=>{ qi=(qi+1)%q.length; renderQ(); sfx("page"); };
  } else { qbox.style.display="none"; }
  $("bookModal").classList.remove("hidden");
}

/* ---------- 声音（Web Audio，极轻） ---------- */
let AC=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==="suspended") AC.resume(); return AC; }
function tone(freq,dur,type,gain){ if(S.mute)return; const a=audio(); if(!a)return; const o=a.createOscillator(),g=a.createGain(); o.type=type||"sine"; o.frequency.value=freq; g.gain.value=0; o.connect(g); g.connect(a.destination); const t=a.currentTime; g.gain.linearRampToValueAtTime(gain||0.06,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.02); }
function noise(dur,gain,filterFreq){ if(S.mute)return; const a=audio(); if(!a)return; const n=a.createBufferSource(); const buf=a.createBuffer(1,Math.max(1,a.sampleRate*dur),a.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1); n.buffer=buf; const f=a.createBiquadFilter(); f.type="lowpass"; f.frequency.value=filterFreq||1200; const g=a.createGain(); g.gain.value=gain||0.05; n.connect(f); f.connect(g); g.connect(a.destination); n.start(); }

      ()=>{ _sfxPend[k]=false; });
  }catch(e){ _sfxPend[k]=false; }
}
function _sfxFire(k){ const a=audio(); if(!a||!_sfxBuf[k]) return; const s=a.createBufferSource(); s.buffer=_sfxBuf[k]; s.connect(a.destination); s.start(0); }

function sfx(kind){
  if(S.mute) return;
  if(kind==="door"){ playSfx("door"); }
  else if(kind==="pour"){ playSfx("pour"); }
  else if(kind==="stir"){ noise(0.18,0.03,1600); }
  else if(kind==="cup"){ tone(420,0.08,"triangle",0.05); }
  else if(kind==="ice"){ tone(1200,0.05,"square",0.03); setTimeout(()=>tone(1500,0.05,"square",0.03),90); }
  else if(kind==="checkout"){ tone(520,0.12,"sine",0.05); setTimeout(()=>tone(780,0.16,"sine",0.05),110); }
  else if(kind==="page"){ noise(0.12,0.03,2000); }
}
function ambientTick(){

/* ---------- 渲染：店铺场景 ---------- */
function skyColor(){
  const b=timeBucket();
  if(b==="morning") return ["#243049","#3a4a63"];
  if(b==="noon") return ["#3a4a63","#6a7c8c"];
  if(b==="dusk") return ["#3a2a3a","#7a4a3a"];
  return ["#0a0e1c","#141a2c"];
}
function renderStore(){
  const sc=skyColor(); const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,sc[0]); g.addColorStop(1,sc[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<7;i++){ const bx=i*70-10, bh=30+((i*37)%24); ctx.fillStyle=["#0d1118","#10141d","#0b0f16"][i%3]; ctx.fillRect(bx,96-bh,bh*1.0,bh+30);
    for(let w=0;w<3;w++){ if((i*7+w*13)%5===0){ ctx.fillStyle="rgba(140,160,190,"+(0.10+0.06*Math.sin(performance.now()/900+i))+")"; ctx.fillRect(bx+4+w*7,100-bh+6,3,4);} } }
  ctx.fillStyle="#0c0f16"; ctx.fillRect(0,150,W,120);
  for(let i=0;i<11;i++){ ctx.fillStyle="rgba(120,150,190,0.04)"; ctx.fillRect(6+i*32,152,2,46); }
  const sx=96, sy=46, sw=300, sh=120;
  ctx.fillStyle="#221a12"; ctx.fillRect(sx,sy,sw,sh+18);
  ctx.fillStyle="#2c2218"; ctx.fillRect(sx-2,sy,sw+4,8);
  const gx=sx+14, gw=sw-28, gy=sy+24, gh=sh-24;
  ctx.fillStyle="#1a140e"; ctx.fillRect(gx,gy,gw,gh);
  const lampOn = timeBucket()==="night"||timeBucket()==="dusk";
  if(lampOn){ ctx.fillStyle="rgba(232,168,92,0.10)"; ctx.fillRect(gx,gy,gw,gh); }
  ctx.fillStyle="rgba(255,210,130,"+(0.12+(lampOn?0.5:0.15))+")"; ctx.fillRect(gx+8,gy+2,gw-16,2);
  ctx.fillStyle="rgba(60,48,32,0.6)"; ctx.fillRect(gx+gw*0.62,gy+8,gw*0.34,gh-20);
  const cols=["rgba(200,85,58,.5)","rgba(95,174,106,.4)","rgba(224,177,74,.5)","rgba(91,134,200,.4)"];
  for(let r=0;r<2;r++)for(let c=0;c<3;c++){ ctx.fillStyle=cols[(r*3+c)%4]; ctx.fillRect(gx+gw*0.64+c*7,gy+12+r*13,4,7); }
  ctx.fillStyle="rgba(70,56,38,0.9)"; ctx.fillRect(gx+6,gy+gh-30,30,18);
  ctx.fillStyle="rgba(90,70,46,1)"; ctx.fillRect(gx+4,gy+gh-34,34,6);
  ctx.fillStyle="rgba(255,205,120,0.8)"; ctx.fillRect(gx+40,gy+gh-30,3,3);
  ctx.fillStyle="rgba(120,90,55,0.8)"; ctx.fillRect(gx+30,gy+gh-22,16,3);
  ctx.fillStyle="rgba(233,226,207,0.10)"; ctx.fillRect(gx+gw*0.40,gy+10,28,22);
  ctx.fillStyle="rgba(90,66,38,0.85)"; ctx.fillRect(gx+gw*0.30,gy+gh-16,gw*0.30,12);
  const dx=sx+sw/2-26, dy=gy, dh=gh;
  ctx.fillStyle="#1a1510"; ctx.fillRect(dx-3,dy-3,56,dh+6);
  ctx.fillStyle="rgba(140,160,190,0.05)"; ctx.fillRect(dx,dy,50,dh);
  if(S.weather.includes("雨")){ ctx.strokeStyle="rgba(180,200,220,0.12)"; ctx.lineWidth=1; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(dx+6+i*10,dy+4); ctx.lineTo(dx+6+i*10-3,dy+18); ctx.stroke(); } }
  customers.forEach(c=>drawCustomer(c));
  const tb=timeBucket();
  if(tb==="night"){ ctx.fillStyle="rgba(10,14,30,0.34)"; ctx.fillRect(0,0,W,H); }
  else if(tb==="dusk"){ ctx.fillStyle="rgba(60,30,20,0.14)"; ctx.fillRect(0,0,W,H); }
  else if(tb==="morning"){ ctx.fillStyle="rgba(255,220,160,0.06)"; ctx.fillRect(0,0,W,H); }
}
function drawCustomer(c){
  const col=c.ch.col;
  ctx.fillStyle="rgba(0,0,0,0.18)"; ctx.beginPath(); ctx.ellipse(c.x,c.y+1,9,3,0,0,7); ctx.fill();
  ctx.fillStyle="#3a3a44"; ctx.fillRect(c.x-5,c.y-14,4,14); ctx.fillRect(c.x+1,c.y-14,4,14);
  ctx.fillStyle=col.shirt; ctx.fillRect(c.x-7,c.y-30,14,18);
  ctx.fillStyle=col.shirt; ctx.fillRect(c.x-9,c.y-29,3,12); ctx.fillRect(c.x+6,c.y-29,3,12);
  ctx.fillStyle="#e8c9a8"; ctx.fillRect(c.x-5,c.y-40,10,10);
  ctx.fillStyle=col.hair; ctx.fillRect(c.x-5,c.y-42,10,5); ctx.fillRect(c.x-6,c.y-40,2,4); ctx.fillRect(c.x+4,c.y-40,2,4);
  ctx.fillStyle=col.accent; ctx.fillRect(c.x-7,c.y-30,14,2);
  if(c.made){ ctx.fillStyle="#fff"; ctx.fillRect(c.x+9,c.y-26,6,7); ctx.fillStyle="#e8d98a"; ctx.fillRect(c.x+10,c.y-25,4,2); }
  if(c.bubbleOn && (c.state==="waiting" || (c.state==="enter" && c.kind==="drink"))){
    const label = c.kind==="drink" ? (DRINK_EMOJI[c.need]||"")+" "+c.need : (GOODS[c.need]||c.need);
    ctx.font="11px sans-serif"; const tw=ctx.measureText(label).width+14;
    const bx=c.x-tw/2, by=c.y-58;
    ctx.fillStyle="rgba(243,230,207,0.92)"; roundRect(bx,by,tw,18,6); ctx.fill();
    ctx.fillStyle="#432f23"; ctx.textAlign="center"; ctx.fillText(label,c.x,by+13);
  }
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  else if(wx==="阴"){ x.fillStyle="#9a9488"; x.beginPath(); x.arc(16,18,7,0,7); x.arc(26,20,6,0,7); x.fill(); }
  else if(wx==="雾"){ x.strokeStyle="#b8b0a0"; x.lineWidth=2; for(let i=0;i<3;i++){ x.beginPath(); x.moveTo(8,12+i*8); x.lineTo(32,12+i*8); x.stroke(); } }
  else { x.fillStyle="#9a9488"; x.beginPath(); x.arc(20,18,7,0,7); x.fill(); }
}

  {t:'也可以什么都不说。'},
  {dir:'sound', s:'rain'},
  {t:'雨，落在玻璃上。'},
  {t:'我们没有办法让外面的世界变得温柔。'},
  {t:'所以只好先把这里的灯开着。'},
  {dir:'title'},
  {t:'欢迎回来。'},
  {t:'或者……'},
  {t:'欢迎第一次来。'},
  {dir:'scene', s:'rainfront'},
  {t:'店门前，雨还在下。'},
  {t:'而你，'},
  {t:'是今晚留在这里的人。'},
  {t:'店长，开门吧。'}
];
/* ---------- 电影式开场（原始：连续场景绘制 + 对话框 + 标题缓出） ---------- */
let introActive=false, introCanvas=null, introX=null, introRain=[];
let introIdx=-1, introTyping=false, introChars=0, introTimer=null, introFull='', introDoorShown=false;
const introState={bright:0,lamp:0,door:0,rain:0,shelter:0};
const introTarget={bright:0,lamp:0,door:0,rain:0,shelter:0};
function rndI(a,b){ return a+Math.random()*(b-a); }
function initIntroRain(){
  introRain=[];
  for(let i=0;i<72;i++) introRain.push({x:rndI(0,360),y:rndI(0,200),len:rndI(3,6),sp:rndI(1.3,2.6)});
}
function lerpIntro(){
  const k=0.018;
  for(const key in introTarget){ introState[key]+=(introTarget[key]-introState[key])*k; }
}
function renderStoreScene(){
  const x=introX; if(!x) return; const W=360,H=200;
  x.clearRect(0,0,W,H);
  const sky=x.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0a0e1c'); sky.addColorStop(1,'#10131f');
  x.fillStyle=sky; x.fillRect(0,0,W,H);
  const bw=['#0d1118','#10141d','#0b0f16'];
  for(let i=0;i<7;i++){ const bx=i*54-10, bh=34+((i*37)%26);
    x.fillStyle=bw[i%3]; x.fillRect(bx,96-bh,bh*1.1,bh+30);
    for(let w=0;w<3;w++){ if((i*7+w*13)%5===0){ x.fillStyle='rgba(120,140,170,0.16)'; x.fillRect(bx+4+w*7,100-bh+6,3,4); } } }
  x.fillStyle='#0e121b'; x.fillRect(0,116,120,34);
  x.fillStyle='#0c0f16'; x.fillRect(0,150,W,50);
  for(let i=0;i<11;i++){ const gx=6+i*32; x.fillStyle='rgba(120,150,190,0.05)'; x.fillRect(gx,152,2,46); }
  const sx=124, sy=54, sw=220, sh=96, lit=introState.lamp;
  x.fillStyle='#221a12'; x.fillRect(sx,sy,sw,sh+18);
  x.fillStyle='#2c2218'; x.fillRect(sx-2,sy,sw+4,8);
  x.fillStyle='#2a2018'; x.fillRect(sx+24,sy+12,sw-48,9);
  const gx=sx+14, gw=sw-28, gy=sy+26, gh=sh-26;
  x.fillStyle='#1a140e'; x.fillRect(gx,gy,gw,gh);
  if(lit>0.01){ x.fillStyle='rgba(232,168,92,'+(lit*0.10)+')'; x.fillRect(gx,gy,gw,gh); }
  x.fillStyle='rgba(255,210,130,'+(0.12+lit*0.55)+')'; x.fillRect(gx+8, gy+2, gw-16, 2);
  if(lit>0.01){
    const sg=x.createRadialGradient(gx+gw*0.13, gy+gh*0.65, 2, gx+gw*0.13, gy+gh*0.65, gw*0.3);
    sg.addColorStop(0,'rgba(240,180,90,'+(lit*0.30)+')'); sg.addColorStop(1,'rgba(240,180,90,0)');
    x.fillStyle=sg; x.fillRect(gx, gy, gw*0.4, gh);
  }
  x.fillStyle='rgba(90,66,38,'+(0.35+lit*0.3)+')'; x.fillRect(gx+gw*0.33, gy+gh-16, gw*0.34, 10);
  x.fillStyle='rgba(60,48,32,'+(0.35+lit*0.3)+')'; x.fillRect(gx+gw*0.62, gy+8, gw*0.34, gh-20);
  if(lit>0.15){
    const cols=['rgba(200,85,58,0.45)','rgba(95,174,106,0.35)','rgba(224,177,74,0.45)','rgba(91,134,200,0.35)'];
    for(let r=0;r<2;r++) for(let c=0;c<3;c++){ x.fillStyle=cols[(r*3+c)%4]; x.fillRect(gx+gw*0.64+c*7, gy+12+r*13, 4,7); }
  }
  const shv=introState.shelter;
  if(shv>0.01){
    const cx=gx+4, cy=gy+gh-26, ca=shv*0.65;
    x.fillStyle='rgba(60,48,34,'+ca+')'; x.fillRect(cx,cy,26,16);
    x.fillStyle='rgba(70,56,38,'+ca+')'; x.fillRect(cx+2,cy+14,2,6); x.fillRect(cx+20,cy+14,2,6);
    x.fillStyle='rgba(255,205,120,'+(ca*0.8)+')'; x.fillRect(cx+22,cy-5,3,3);
  }
  const doorW=50, dx=sx+sw/2-doorW/2, dy=gy, dh=gh, open=introState.door;
  x.fillStyle='#1a1510'; x.fillRect(dx-3,dy-3,doorW+6,dh+6);
  const leftW=doorW/2-open*15, rightW=doorW/2-open*15;
  x.fillStyle='rgba(140,160,190,0.05)';
  if(leftW>1) x.fillRect(dx-open*15, dy, leftW, dh);
  if(rightW>1) x.fillRect(dx+doorW/2+open*15, dy, rightW, dh);
  x.strokeStyle='rgba(110,130,150,0.12)'; x.lineWidth=1;
  if(leftW>2){ x.strokeRect(dx-open*15+0.5, dy+0.5, leftW-1, dh-1); }
  if(rightW>2){ x.strokeRect(dx+doorW/2+open*15+0.5, dy+0.5, rightW-1, dh-1); }
  if(lit>0.01){
    x.fillStyle='rgba(232,168,92,'+(lit*0.05)+')';
    if(leftW>1) x.fillRect(dx-open*15,dy,leftW,dh);
    if(rightW>1) x.fillRect(dx+doorW/2+open*15,dy,rightW,dh);
  }
  if(introState.rain>0.3 && lit>0.1){
    x.fillStyle='rgba(180,200,220,0.03)';
    if(leftW>1) x.fillRect(dx-open*15,dy,leftW,dh);
    if(rightW>1) x.fillRect(dx+doorW/2+open*15,dy,rightW,dh);
    x.strokeStyle='rgba(180,200,220,0.06)'; x.lineWidth=1;
    for(let i=0;i<3;i++){ const wx=dx+6+i*14+((i%2)*3), wy=dy+4+((i*7)%8);
      x.beginPath(); x.moveTo(wx,wy); x.lineTo(wx-1,wy+6); x.stroke(); }
  }
  if(lit>0.01){ const fg=x.createLinearGradient(0,dy+dh,0,dy+dh+22);
    fg.addColorStop(0,'rgba(232,168,92,'+(lit*0.14)+')'); fg.addColorStop(1,'rgba(232,168,92,0)');
    x.fillStyle=fg; x.fillRect(dx-6,dy+dh,doorW+12,22); }
  const ubx=dx-15, uby=sy+sh+14;
  x.fillStyle='#241c12'; x.fillRect(ubx,uby-12,7,12);
  x.fillStyle='#2e2418'; x.fillRect(ubx,uby-12,7,2);
  x.strokeStyle='#4a3d2e'; x.lineWidth=1;
  x.beginPath(); x.moveTo(ubx+2,uby-11); x.lineTo(ubx+1,uby-20); x.stroke();
  x.fillStyle='rgba(90,80,66,0.7)'; x.fillRect(ubx,uby-21,2,2);
  x.strokeStyle='#3e342a'; x.lineWidth=1;
  x.beginPath(); x.moveTo(ubx+4,uby-12); x.lineTo(ubx+7,uby-18); x.stroke();
  x.fillStyle='rgba(74,64,52,0.65)'; x.fillRect(ubx+6,uby-19,2,2);
  const rA=introState.rain;
  if(rA>0.01){ x.strokeStyle='rgba(170,184,200,'+(rA*0.38)+')'; x.lineWidth=1;
    for(const d of introRain){ x.beginPath(); x.moveTo(d.x,d.y); x.lineTo(d.x-1,d.y+d.len); x.stroke(); } }
  const b=introState.bright;
  if(b<0.999){ x.fillStyle='rgba(6,8,15,'+(1-b)+')'; x.fillRect(0,0,W,H); }
}
function introLoop(){
  if(!introActive) return;
  lerpIntro();
  for(const d of introRain){ d.y+=d.sp; if(d.y>205){ d.y=-5; d.x=rndI(0,360); } }
  renderStoreScene();
  requestAnimationFrame(introLoop);
}
function showIntroText(text){
  introFull=text; introChars=0; introTyping=true;
  $("introText").textContent='';
  $("introHint").style.display='none';
  introTimer=setInterval(()=>{
    introChars++;
    $("introText").textContent=introFull.slice(0,introChars);
    if(introChars>=introFull.length){ clearInterval(introTimer); introTyping=false; $("introHint").style.display='block'; if(introIdx===introScript.length-1) showDoor(); }
  }, 45);
}
function finishIntroText(){
  if(introTimer) clearInterval(introTimer);
  $("introText").textContent=introFull; introTyping=false; $("introHint").style.display='block';
  if(introIdx===introScript.length-1) showDoor();
}
function applyDir(step){
  const d=step.dir;
  if(d==='black'){ for(const k in introTarget) introTarget[k]=0; $("introTitle").classList.remove('show'); }
  else if(d==='fadein'){ introTarget.bright=1; introTarget.rain=1; introTarget.lamp=0.35; }
  else if(d==='lamp'){ introTarget.lamp=1; }
  else if(d==='scene'){
    if(step.s==='door'){ introTarget.door=1; introTarget.shelter=1; sfx("door"); }
    else if(step.s==='warm'){ introTarget.lamp=1; }
  }
  else if(d==='sound'){ audio(); }
  else if(d==='title'){
    $("introTitle").textContent='小小的店'; $("introTitle").classList.add('show');
    audio();
  }
}
function advanceIntro(){
  if(!AC) audio();
  if(introTyping){ finishIntroText(); return; }
  introIdx++;
  while(introIdx<introScript.length && introScript[introIdx].dir){ applyDir(introScript[introIdx]); introIdx++; }
  if(introIdx>=introScript.length) return;
  const step=introScript[introIdx];
  showIntroText(step.t);
}
function showDoor(){ introDoorShown=true; $("openDoorBtn").style.display='block'; $("introHint").style.display='none'; }
function startIntro(){
  initIntroRain();
  introCanvas=$("introCanvas"); introX=introCanvas.getContext('2d'); introX.imageSmoothingEnabled=false;
  introActive=true; requestAnimationFrame(introLoop);
}
function startOpening(){
  introIdx=-1; introTyping=false; introDoorShown=false; introFull='';
  if(introTimer) clearInterval(introTimer);
  $("introTitle").classList.remove('show');
  $("introText").textContent='';
  $("openDoorBtn").style.display='none';
  $("introHint").style.display='none';
  $("opening").style.opacity='1'; $("opening").style.display='flex'; $("opening").classList.remove('gone');
  for(const k in introTarget) introTarget[k]=0;
  for(const k in introState) introState[k]=0;
  startIntro();
  advanceIntro();
}

$("opening").onclick=()=>{ if(introDoorShown) return; advanceIntro(); };
$("openDoorBtn").onclick=(e)=>{ e.stopPropagation(); openDoor(); };

/* ---------- 开场 / 开门 ---------- */
function fitStage(){ const s=Math.min(window.innerWidth/W, window.innerHeight/H, 1.6); stage.style.transform="scale("+s+")"; }
window.addEventListener("resize", fitStage);
function showReturnMsg(){
  const msgs=["昨晚你把Shelter的灯留到了很晚。","今天的店里，应该会比昨天暖和一点。","风把门口的伞吹倒了，又自己站了回去。","昨天的便签还在墙上，你写的那张在最上面。"];
  narrate(S.lastLeave || pick(msgs));
}
function openDoor(){
  try{ if(AC && AC.state==="suspended") AC.resume(); }catch(e){}
  introActive=false;
  audio();
  $("opening").classList.add("gone");
  setTimeout(()=>{ $("opening").style.display="none"; }, 900);
  S.storeOpen=true; save();
  sfx("door");
  if(S.dateStr!==new Date().toISOString().slice(0,10)) showReturnMsg();
}

/* ---------- 自动收店 ---------- */
function autoClose(){
  if(!S.storeOpen) return;
  if(S.minutes>=1320){
    S.storeOpen=false;
    S.day+=1;
    S.lastLeave = pick(["今晚收店时，窗外还有一点亮。明天大概会是个好天气吧。","今天没有什么特别的事情。这样也很好。","忘记买草莓了。明天一定记得。"]);
    S.weather = pick(WEATHERS);
    S.minutes=480; S.dateStr=new Date().toISOString().slice(0,10);
    save();
    narrate("灯关了。明天见。");
    $("opening").style.display="flex"; $("opening").classList.remove("gone");
    startOpening();
  }
}

/* ---------- 主循环 ---------- */
let last=performance.now(), spawnAcc=0, ambAcc=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(S.storeOpen){
    S.minutes += dt*1.6;
    autoClose();
    spawnAcc+=dt; if(spawnAcc>3.2){ spawnAcc=0; trySpawn(); }
    ambAcc+=dt; if(ambAcc>7){ ambAcc=0; ambientTick(); }
  }
  updateCustomers(dt);
  renderStore();
  if(making) drawMake();
  $("hudTime").textContent=timeLabel();
  $("hudWeather").textContent=S.weather.includes("雨")?"雨":S.weather;
  const atCounter = customers.some(c=>c.state==="atCounter");
  $("btnMake").classList.toggle("hide", !(S.storeOpen && !making));
  $("btnCheck").classList.toggle("hide", !atCounter);
  $("btnDiary").classList.toggle("hide", !S.storeOpen);
  $("shelterSpot").classList.toggle("hide", !S.storeOpen);
  // 一次性空闲学习提示
  if(freeNow() && ALL_DRINKS.some(d=>!S.unlocked.includes(d)) && !S.seenEvents.includes("learntip") && !making){
    S.seenEvents.push("learntip"); save();
    setTimeout(()=>narrate("客人还没来。这种空档正好可以学做一道新饮品——点「制作饮品」就能看到想学的。"), 800);
  }
  requestAnimationFrame(frame);
}

/* ---------- 启动 ---------- */
newDay();
fitStage();
$("btnMute").classList.toggle("muted", S.mute);
document.querySelectorAll("[data-close]").forEach(el=>el.onclick=()=>$(el.dataset.close).classList.add("hidden"));
if(S.storeOpen){
  $("opening").style.display="none"; $("opening").classList.add("gone");
} else {
  startOpening();
}
requestAnimationFrame(frame);
setInterval(()=>{ if(S.storeOpen && Math.random()<0.02) genDiary(pick(["book","note",""])); }, 30000);
</script>
